<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="在本机分类、预览和整理抖音收藏的视频与图文。">
  <title>拾藏 · 抖音收藏整理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='none' stroke='%23b8336a' stroke-width='3' stroke-linejoin='round' d='M8 4h16v24l-8-5-8 5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#collections" aria-label="拾藏首页">
        <svg viewBox="0 0 32 40" aria-hidden="true"><path d="M5 3h22v33l-11-7-11 7z"/></svg>
        <span><strong>拾藏</strong><small>抖音收藏整理</small></span>
      </a>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <a href="#settings" class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.8 2.4-2 .9L4 5.8 2 9l1.7 1.7v2.6L2 15l2 3.2 2.2-.5 2 .9L9 21h4l.8-2.4 2-.9 2.2.5 2-3.2-1.7-1.7v-2.6L20 9l-2-3.2-2.2.5-2-.9L13 3z"/><circle cx="11" cy="12" r="3"/></svg>连接与设置</a>
        <div class="connection"><span class="status-dot" id="connection-dot"></span><span id="connection-label">正在检查本机状态</span></div>
        <div class="sidebar-note" id="scan-stamp">运行在你的电脑上</div>
      </div>
    </aside>
    <header class="mobile-bar"><button class="icon-button" id="menu-toggle" aria-label="打开导航" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a href="#collections">拾藏</a><span>本机应用</span></header>
    <main class="canvas" id="main">
      <div id="workflow" class="workflow" aria-label="整理步骤"></div>
      <div id="job-banner" aria-live="polite"></div>
      <div id="view"><div class="loading-state">正在打开收藏工作台…</div></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <div class="dialog-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
      <h2 id="confirm-title">按这个方案整理收藏？</h2>
      <p id="confirm-description"></p>
      <div id="confirm-folders" class="confirm-folders"></div>
      <p class="helper">确认后会打开本机抖音窗口，创建缺少的收藏夹并移动作品。原收藏夹保留，每条操作都会留下记录。</p>
      <div class="dialog-actions"><button value="cancel" class="button secondary">返回预览</button><button type="button" id="confirm-execute" class="button primary">确认并开始整理</button></div>
    </form>
  </dialog>
  <dialog id="rename-dialog" aria-labelledby="rename-title">
    <form id="rename-form">
      <h2 id="rename-title">修改收藏夹名称</h2>
      <p class="helper">这会更新方案中所有归入该分类的作品。</p>
      <label for="folder-name">收藏夹名称</label>
      <input id="folder-name" name="name" maxlength="20" required>
      <div class="dialog-actions"><button type="button" data-action="cancel-rename" class="button secondary">取消</button><button class="button primary">保存名称</button></div>
    </form>
  </dialog>
  <noscript><p>拾藏需要启用 JavaScript，才能扫描和整理收藏。</p></noscript>
</body>
</html>
